name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install --upgrade esphome
      - name: Build local CI config
        run: |
          cp example/hello_world_m5papers3.yaml hello_world_ci.yaml
          sed -i 's|type: git|type: local|g' hello_world_ci.yaml
          sed -i 's|url: https://github.com/ThomasHFWright/ESPHomeFastEPD|path: ./components|g' hello_world_ci.yaml
          sed -i '/ref: main/d' hello_world_ci.yaml
      - name: Validate example YAML
        run: esphome config hello_world_ci.yaml
