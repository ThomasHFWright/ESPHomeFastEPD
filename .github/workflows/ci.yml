name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install --upgrade esphome
      - name: Build local CI config
        run: |
          cp example/hello_world_m5papers3.yaml hello_world_ci.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path('hello_world_ci.yaml')
          data = path.read_text()
          data = data.replace('type: git', 'type: local')
          data = data.replace(
              'url: https://github.com/ThomasHFWright/ESPHomeFastEPD',
              'path: ./components',
          )
          data = data.replace('      ref: main\n', '')
          path.write_text(data)
          PY
      - name: Validate example YAML
        run: esphome config hello_world_ci.yaml
